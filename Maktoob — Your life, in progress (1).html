<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maktoob — Your life, in progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f1ece0;--mute:#9a958a;--olive:#9fb26a;--terra:#e2805f;--butter:#242424;--line:#2a2a2a;--on:#0a0a0a;--r:18px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="light"]{--bg:#f4ecdc;--card:#fffaf0;--ink:#2b2a22;--mute:#7a7360;--olive:#66763a;--terra:#c0603e;--butter:#d9e0bd;--line:#e3d8bf;--on:#fff;color-scheme:light}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:flex;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}
aside{width:210px;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px;transition:width .25s;flex-shrink:0;overflow:hidden}
aside.c{width:64px}aside.c .lb,aside.c .logo small{display:none}
.logo{font:700 24px Fraunces,serif;color:var(--terra);padding:0 8px 12px}.logo small{display:block;font:italic 12px Fraunces,serif;color:var(--mute)}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;width:100%;box-sizing:border-box;white-space:nowrap}
nav button:hover{background:var(--bg)}nav button.on{background:var(--butter);color:var(--ink);font-weight:600}
main{flex:1;min-width:0;overflow:auto;padding:22px clamp(14px,3vw,36px) 90px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px}
input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
textarea{width:100%;min-height:70px}input[type=search]{flex:1}
button.b{cursor:pointer;transition:transform .15s}button.b:hover{transform:translateY(-1px)}button.b:active{transform:scale(.97)}
.p{background:var(--olive);color:var(--on);border-color:var(--olive)}.t{background:var(--terra);color:var(--on);border-color:var(--terra)}.g{border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.card h3{margin-bottom:10px;font-size:20px}.hero{background:var(--butter);color:var(--ink);border:none;grid-column:1/-1;overflow:hidden}
.hero:after{content:"✿";position:absolute;right:18px;top:-10px;font-size:90px;opacity:.18;transform:rotate(15deg)}
.boss{border:2px solid var(--terra);background:var(--card)}.tag{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);margin-right:4px;display:inline-block}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}.row .m{flex:1;min-width:0}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--olive);background:none;cursor:pointer;flex-shrink:0;color:var(--olive)}.ck:hover{background:var(--olive);color:var(--on)}
.mute{color:var(--mute);font-size:13px}.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--olive);transition:width .5s}
.over{color:var(--terra);font-weight:600}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .b.on{background:var(--ink);color:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal div{min-height:62px;border:1px solid var(--line);border-radius:10px;padding:4px;font-size:12px;background:var(--card);cursor:pointer}.cal .h{min-height:0;border:0;background:none;text-align:center;cursor:default;color:var(--mute)}.cal .td{outline:2px solid var(--terra)}.cal .sel{background:var(--butter);color:var(--ink)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--olive);margin:1px}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);max-width:460px;width:92%}dialog::backdrop{background:#0006}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 2px}dialog input,dialog select{width:100%}
.timer{font:700 54px Fraunces,serif;text-align:center}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}#toast.s{opacity:1}
@media(max-width:700px){body{display:block}aside{position:fixed;bottom:0;left:0;right:0;width:100%!important;height:auto;flex-direction:row;padding:6px;z-index:5;border:0;border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}.logo,#col{display:none}nav{display:flex;width:100%}nav button{flex-direction:column;gap:0;font-size:11px;justify-content:center}aside.c .lb{display:inline}main{height:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside id="sb"><div class="logo">Maktoob<small>Your life, in progress</small></div>
<nav id="nav"></nav><button class="b g" id="col" onclick="sb.classList.toggle('c')" aria-label="Collapse sidebar">⇔</button></aside>
<main><div class="top"><input type="search" id="q" placeholder="Search tasks and goals…" oninput="go('tasks',this.value)"><button class="b p" onclick="editT()">+ Task</button></div><div id="v"></div></main>
<dialog id="dt"><form method="dialog" onsubmit="return false"><h3 id="dtt">Task</h3>
<label>Title</label><input id="f_t" required maxlength="140"><label>Notes</label><textarea id="f_n"></textarea>
<label>Category</label><select id="f_c"></select><label>Linked goal</label><select id="f_g"></select>
<label>Priority</label><select id="f_p"><option value="3">High</option><option value="2" selected>Medium</option><option value="1">Low</option></select>
<label>Due date</label><input type="date" id="f_d"><label>Time (optional, for reminders)</label><input type="time" id="f_tm">
<label>Estimated minutes</label><input type="number" id="f_e" min="0" max="600"><label>Repeats</label><select id="f_r"><option value="">Never</option><option value="d">Daily</option><option value="w">Weekly</option></select>
<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="b" onclick="dt.close()">Cancel</button><button class="b p" onclick="saveT()">Save</button></div></form></dialog>
<dialog id="dg"><form method="dialog" onsubmit="return false"><h3>New goal</h3><label>Goal</label><input id="g_t" maxlength="140"><label>Type</label><select id="g_y"><option value="long">Long-term</option><option value="month">Monthly objective</option><option value="week">Weekly target</option></select>
<label>Category</label><select id="g_c"></select><label>Next action</label><input id="g_a"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="b" onclick="dg.close()">Cancel</button><button class="b p" onclick="saveG()">Save</button></div></form></dialog>
<dialog id="dc"><form method="dialog" onsubmit="return false"><h3 id="dct">LeetCode problem</h3><label>Problem name</label><input id="c_n" maxlength="140"><label>URL (optional)</label><input id="c_u" type="url"><label>Topic</label><select id="c_t"></select><label>Difficulty</label><select id="c_d"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><label>Date</label><input type="date" id="c_dt"><label>Status</label><select id="c_s"><option>Solved</option><option>Attempted</option><option>Stuck</option></select><label>Attempts</label><input type="number" id="c_a" min="1" value="1"><label>Time taken (min)</label><input type="number" id="c_m" min="0"><label>Solution notes</label><textarea id="c_no"></textarea><label>Mistakes</label><textarea id="c_mi"></textarea><label>Time / space complexity</label><input id="c_cx" placeholder="O(n) / O(1)"><label>Next revision (blank = auto)</label><input type="date" id="c_r"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="b" onclick="dc.close()">Cancel</button><button class="b p" onclick="saveP()">Save</button></div></form></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date()),addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const def=()=>({name:'',tone:'balanced',cats:['Startup','LeetCode','College','Learning','Career','Writing','Health','Personal'],lc:[],ctarget:1,topics:['Arrays','Strings','Hashing','Two Pointers','Sliding Window','Linked Lists','Stacks','Queues','Trees','Graphs','Recursion','Dynamic Programming'],tasks:[],goals:[],energy:{},focus:[],reviews:[]});
let S=def(),mem=false;
try{const r=localStorage.getItem('maktoob');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){mem=true}
function save(){try{localStorage.setItem('maktoob',JSON.stringify(S));mem=false}catch(e){mem=true;toast('Could not save to this browser — export a backup!')}}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
const VIEWS={today:['☀','Today'],tasks:['✓','Tasks'],goals:['◎','Goals'],cal:['▦','Calendar'],code:['⌨','Coding Lab'],boss:['★','Boss Mode'],set:['⚙','Settings']};
$('#nav').innerHTML=Object.entries(VIEWS).map(([k,[i,l]])=>`<button data-k="${k}" onclick="go('${k}')"><span>${i}</span><span class="lb">${l}</span></button>`).join('');
let view='today',filt='today',qs='',calM=new Date(),calSel=today(),fi=null;
function go(v,q){view=v;qs=q||'';if(v!=='tasks'||q===undefined)$('#q').value=q||'';if(q)view='tasks';render()}
const open=()=>S.tasks.filter(t=>t.status==='open');
const goalName=id=>(S.goals.find(g=>g.id===id)||{}).title;
function prog(g){const m=g.ms||[];if(m.length)return Math.round(m.filter(x=>x.d).length/m.length*100);const l=S.tasks.filter(t=>t.goal===g.id&&t.status!=='archived');return l.length?Math.round(l.filter(t=>t.status==='done').length/l.length*100):0}
function score(t){const td=today();let s=t.pri*10+(t.postponed||0)*4;if(t.due){if(t.due<td)s+=60;else if(t.due===td)s+=40;else if(t.due<=addD(td,2))s+=15}return s}
const ranked=()=>open().sort((a,b)=>score(b)-score(a));
function taskRow(t){const td=today(),od=t.due&&t.due<td;return`<div class="row"><button class="ck" onclick="done('${t.id}')" aria-label="Complete ${esc(t.title)}">${t.status==='done'?'✓':''}</button><div class="m"><b style="${t.status==='done'?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}</b><div class="mute"><span class="tag">${esc(t.cat)}</span>${t.due?`<span class="${od&&t.status==='open'?'over':''}">${od&&t.status==='open'?'Overdue · ':''}${t.due}${t.time?' '+t.time:''}</span>`:''}${t.est?` · ${t.est}m`:''}${t.rec?' · ↻':''}${t.goal?' · ◎ '+esc(goalName(t.goal)||''):''}${t.postponed?` · moved ${t.postponed}×`:''}</div></div>${t.status==='open'?`<button class="b" onclick="postpone('${t.id}')" title="Move to tomorrow">→</button>`:''}<button class="b" onclick="editT('${t.id}')" title="Edit">✎</button><button class="b" onclick="del('${t.id}')" title="Delete">🗑</button></div>`}
function suggestion(){const en=S.energy[today()],r=ranked();if(!r.length)return null;let pool=r;if(en===1){const sm=r.filter(t=>t.est&&t.est<=25);if(sm.length)pool=sm}return pool[0]}
const TONE={gentle:['Whenever you are ready, a soft place to begin:','Rest counts too. Here is something small when you want it.'],balanced:['Your next move:','Steady wins. Start with this one.'],strict:['Do this now:','No more circling — begin, even for 10 minutes.']};
function bossCard(){const t=suggestion(),en=S.energy[today()],tn=TONE[S.tone];if(!t)return`<div class="card boss"><h3>Boss Mode: Your Next Move</h3><p>No open tasks yet. Add one, or rest — both are valid.</p></div>`;
const why=[];if(t.due&&t.due<today())why.push('it is overdue');else if(t.due===today())why.push('it is due today');if(t.pri===3)why.push('high priority');if(t.postponed)why.push(`it has moved ${t.postponed}×`);if(en===1)why.push('energy is low, so favoring something short');
return`<div class="card boss"><h3>Boss Mode: Your Next Move</h3><div class="mute">${tn[0]}</div><h2 style="margin:6px 0">${esc(t.title)}</h2><p class="mute">Why: ${why.join(', ')||'it is your highest-scored open task'}. (Rule-based, from your saved tasks.)</p>${t.postponed>=2?`<button class="b t" onclick="split('${t.id}')">Break into smaller steps</button> `:''}<button class="b p" onclick="focusFor('${t.id}')">Start focus</button> <button class="b" onclick="done('${t.id}')">Done</button></div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===view));const m={today:vToday,tasks:vTasks,goals:vGoals,cal:vCal,code:vCode,boss:vBoss,set:vSet};$('#v').innerHTML=m[view]()}
function vToday(){const td=today(),h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening',r=ranked(),tdy=open().filter(t=>t.due&&t.due<=td),up=open().filter(t=>t.due>td).sort((a,b)=>a.due>b.due?1:-1).slice(0,5);
const wk=addD(td,-6),dn=S.tasks.filter(t=>t.done&&t.done>=wk).length,tot=dn+open().filter(t=>t.due&&t.due<=addD(td,6)).length,fm=S.focus.filter(f=>f.d===td).reduce((a,f)=>a+f.m,0),en=S.energy[td];
const P=['Write about a smell that takes you somewhere else.','What did you almost say today?','Describe home without naming it.','A line about waiting, in Hindi, Urdu or Punjabi.','Write to your future self from this exact window.','What does patience look like in your hands?','Write the ending first.'][new Date().getDay()];
return`<div class="grid"><div class="card hero"><h1 style="font-size:34px">${g}${S.name?', '+esc(S.name):''}.</h1><div>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} — Today's Chapter</div><div style="margin-top:12px"><button class="b p" onclick="view='boss';render();setTimeout(()=>focusFor(),0)">Start focus session</button> <button class="b" onclick="editT()">Add task</button> <button class="b" onclick="editP()">Log LeetCode</button> <button class="b" onclick="newG()">New goal</button></div></div>
${bossCard()}
<div class="card"><h3>Top three priorities</h3>${r.slice(0,3).map(taskRow).join('')||'<p class="mute">Nothing open. Add a task to begin your chapter.</p>'}</div>
<div class="card"><h3>Today &amp; overdue</h3>${tdy.map(taskRow).join('')||'<p class="mute">Nothing due today.</p>'}</div>
<div class="card"><h3>Coming up</h3>${up.map(taskRow).join('')||'<p class="mute">No upcoming dated tasks.</p>'}</div>
<div class="card"><h3>This week</h3><div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><p class="mute">${dn} done of ${tot} planned in the last 7 days · ${fm} focus min today</p></div>
<div class="card"><h3>Coding</h3><p><b>${cStreak()}</b>-day streak · ${S.lc.filter(p=>p.date===td).length}/${S.ctarget} today · ${S.lc.filter(p=>p.rev&&p.rev<=td).length} to revise</p><button class="b" onclick="editP()">Log problem</button> <button class="b" onclick="go('code')">Open lab</button></div>
<div class="card"><h3>Energy check-in</h3><p class="mute">How is your energy right now? Optional, private.</p>${[['Low',1],['Okay',2],['High',3]].map(([l,v])=>`<button class="b ${en===v?'p':''}" onclick="S.energy['${td}']=${v};save();render()">${l}</button> `).join('')}</div>
<div class="card" style="background:var(--butter);color:var(--ink)"><h3>Writing prompt</h3><p class="serif" style="font-style:italic;font-size:18px">${P}</p></div></div>`}
function vTasks(){const td=today(),q=qs.toLowerCase(),F={today:t=>t.status==='open'&&t.due&&t.due<=td,upcoming:t=>t.status==='open'&&t.due>td,overdue:t=>t.status==='open'&&t.due&&t.due<td,done:t=>t.status==='done',all:t=>t.status!=='archived'};
let l=S.tasks.filter(F[filt]);if(q)l=l.filter(t=>(t.title+t.notes+t.cat).toLowerCase().includes(q));l.sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1);
const gl=q?S.goals.filter(g=>g.title.toLowerCase().includes(q)):[];
return`<h2>Tasks</h2><div class="tabs">${Object.keys(F).map(k=>`<button class="b ${k===filt?'on':''}" onclick="filt='${k}';render()">${k}</button>`).join('')}</div><div class="card">${l.map(taskRow).join('')||'<p class="mute">Nothing here. A clear list is a good thing.</p>'}</div>${gl.length?'<h3 style="margin:16px 0 6px">Matching goals</h3>'+gl.map(g=>`<div class="card">${esc(g.title)}</div>`).join(''):''}`}
function vGoals(){return`<div class="top"><h2 style="flex:1">Goals</h2><button class="b p" onclick="newG()">+ Goal</button></div><div class="grid">${S.goals.map(g=>`<div class="card"><span class="tag">${{long:'Long-term',month:'Monthly',week:'Weekly'}[g.type]}</span><span class="tag">${esc(g.cat)}</span><h3 style="margin-top:8px">${esc(g.title)}</h3><div class="bar"><i style="width:${prog(g)}%"></i></div><p class="mute">${prog(g)}% · ${S.tasks.filter(t=>t.goal===g.id&&t.status==='open').length} open linked tasks</p>${g.next?`<p>Next: ${esc(g.next)}</p>`:''}${(g.ms||[]).map((m,i)=>`<label style="display:flex;gap:8px;color:var(--ink);font-size:14px"><input type="checkbox" ${m.d?'checked':''} onchange="g_ms('${g.id}',${i})">${esc(m.t)}</label>`).join('')}<button class="b" onclick="addMs('${g.id}')">+ Milestone</button> <button class="b" onclick="delG('${g.id}')">Delete</button></div>`).join('')||'<div class="card"><p>No goals yet. Add one, then link tasks to it.</p></div>'}</div>`}
function vCal(){const y=calM.getFullYear(),mo=calM.getMonth(),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();let c=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<span></span>'.repeat(f).replace(/<span><\/span>/g,'<div class="h"></div>');
for(let d=1;d<=n;d++){const s=ymd(new Date(y,mo,d)),k=S.tasks.filter(t=>t.due===s&&t.status!=='archived');c+=`<div class="${s===today()?'td':''} ${s===calSel?'sel':''}" onclick="calSel='${s}';render()">${d}<br>${k.slice(0,6).map(()=>'<span class="dot"></span>').join('')}</div>`}
const sel=S.tasks.filter(t=>t.due===calSel&&t.status!=='archived');
return`<div class="top"><h2 style="flex:1">${calM.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="b" onclick="calM=new Date(${y},${mo-1},1);render()">‹</button><button class="b" onclick="calM=new Date();calSel=today();render()">Today</button><button class="b" onclick="calM=new Date(${y},${mo+1},1);render()">›</button></div><div class="cal">${c}</div><div class="card" style="margin-top:14px"><h3>${calSel}</h3>${sel.map(taskRow).join('')||'<p class="mute">Nothing planned.</p>'}<button class="b" onclick="editT(null,'${calSel}')">+ Add for this day</button></div>`}
function vBoss(){const td=today(),od=open().filter(t=>t.due&&t.due<td),pp=open().filter(t=>t.postponed>=2),wk=addD(td,-6),dn=S.tasks.filter(t=>t.done&&t.done>=wk),
ng=S.goals.filter(g=>!S.tasks.some(t=>t.goal===g.id&&(t.done||'')>=wk));
const last=S.reviews[S.reviews.length-1];
return`<h2>Boss Mode</h2><p class="mute">Rule-based on your saved data. No AI service is running.</p><div class="tabs">${['gentle','balanced','strict'].map(k=>`<button class="b ${S.tone===k?'on':''}" onclick="S.tone='${k}';save();render()">${k}</button>`).join('')}</div><div class="grid">${bossCard()}
<div class="card"><h3>Focus timer</h3><div class="timer" id="tm">25:00</div><p style="text-align:center"><input type="number" id="tmin" value="25" min="1" max="180" style="width:80px"> min <button class="b p" id="tgo" onclick="tStart()">Start</button> <button class="b" onclick="tReset()">Reset</button></p><p class="mute" id="tl"></p></div>
<div class="card"><h3>Needs attention</h3>${od.length?`<p><b>${od.length}</b> overdue — reschedule or shrink them:</p>`+od.slice(0,4).map(taskRow).join(''):'<p>No overdue tasks.</p>'}${pp.length?`<p>Often postponed:</p>`+pp.map(t=>`<div class="row"><div class="m">${esc(t.title)}</div><button class="b t" onclick="split('${t.id}')">Split</button></div>`).join(''):''}${ng.length?`<p class="mute">Quiet goals this week: ${ng.map(g=>esc(g.title)).join(', ')}. No pressure — maybe one tiny step?</p>`:''}</div>
<div class="card"><h3>Celebrate</h3><p>${dn.length?`You finished <b>${dn.length}</b> task${dn.length>1?'s':''} in the last 7 days. That is real.`:'Nothing logged yet this week — resting is part of the work.'}</p></div>
<div class="card" style="grid-column:1/-1"><h3>Weekly review</h3><p class="mute">Completed: ${dn.length} · Rescheduled tasks: ${S.tasks.filter(t=>t.postponed).length}</p>${[['learned','What did I learn?'],['avoided','What did I avoid?'],['next','What matters most next week?']].map(([k,l])=>`<label>${l}</label><textarea id="r_${k}"></textarea>`).join('')}<button class="b p" style="margin-top:8px" onclick="saveR()">Save review</button>${last?`<p class="mute">Last saved ${last.d}: ${esc(last.next)}</p>`:''}</div></div>`}
function vSet(){const np='Notification' in window?Notification.permission:'unsupported';
return`<h2>Settings &amp; data</h2><div class="grid"><div class="card"><h3>You</h3><label>Name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><label>Theme</label><select onchange="document.documentElement.dataset.mode=this.value||''"><option value="">Black (default)</option><option value="light">Light cream</option></select></div>
<div class="card"><h3>Categories</h3>${S.cats.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}<br><input id="nc" placeholder="New category"> <button class="b" onclick="addCat()">Add</button></div>
<div class="card"><h3>Storage</h3><p>${mem?'⚠ Browser storage is unavailable — data lives only until you close this tab.':'Saved <b>locally in this browser only</b>. No account, no cloud. Clearing site data or switching device loses it, so export backups.'}</p><button class="b p" onclick="exp()">Export JSON</button> <button class="b" onclick="$('#imp').click()">Restore JSON</button><input type="file" id="imp" accept=".json" hidden onchange="imp(this)"></div>
<div class="card"><h3>Reminders</h3><p>Status: <b>${np}</b>. Reminders fire only while this page is open in a browser that allows notifications. If the app is closed, nothing is sent.</p><button class="b" onclick="askN()">Enable notifications</button></div></div>`}
let cpId=null,cf={t:'',d:''};
function cStreak(){const s=new Set(S.lc.map(p=>p.date));let d=today();if(!s.has(d))d=addD(d,-1);let n=0;while(s.has(d)){n++;d=addD(d,-1)}return n}
function vCode(){const td=today(),L=S.lc,sv=L.filter(p=>p.status==='Solved'),n=d=>sv.filter(p=>p.diff===d).length,tc=L.filter(p=>p.date===td).length,due=L.filter(p=>p.rev&&p.rev<=td).sort((a,b)=>a.rev>b.rev?1:-1),
wk=[6,5,4,3,2,1,0].map(i=>{const d=addD(td,-i);return[d,L.filter(p=>p.date===d).length]}),mx=Math.max(1,...wk.map(x=>x[1])),
list=L.filter(p=>(!cf.t||p.topic===cf.t)&&(!cf.d||p.diff===cf.d)).sort((a,b)=>a.date<b.date?1:-1);
return`<div class="top"><h2 style="flex:1">Coding Lab</h2><button class="b t" onclick="editP()">+ Log problem</button></div><p class="mute">Manual log — nothing here is synced from LeetCode.</p><div class="grid">
<div class="card"><h3>Today</h3><div class="timer">${tc}/${S.ctarget}</div><div class="bar"><i style="width:${Math.min(100,tc/S.ctarget*100)}%"></i></div><p class="mute">Daily target <input type="number" min="1" max="20" value="${S.ctarget}" style="width:64px" onchange="S.ctarget=Math.max(1,+this.value||1);save();render()"> · streak <b>${cStreak()}</b> days (a day counts if you log any problem)</p></div>
<div class="card"><h3>Solved</h3><p><span class="tag">Easy ${n('Easy')}</span><span class="tag">Medium ${n('Medium')}</span><span class="tag">Hard ${n('Hard')}</span></p><p class="mute">${sv.length} solved of ${L.length} logged</p></div>
<div class="card"><h3>Last 7 days</h3><div style="display:flex;gap:8px;align-items:flex-end;height:90px">${wk.map(([d,c])=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${c/mx*60}px;min-height:2px;background:var(--terra);border-radius:6px"></div>${c}<br>${d.slice(8)}</div>`).join('')}</div></div>
<div class="card"><h3>Revision queue</h3>${due.map(p=>`<div class="row"><div class="m"><b>${esc(p.name)}</b><div class="mute">${esc(p.topic)} · due ${p.rev}</div></div><button class="b p" onclick="revDone('${p.id}')">Revised</button></div>`).join('')||'<p class="mute">Nothing due. Revision dates appear after you log problems.</p>'}</div>
<div class="card"><h3>Topics</h3>${S.topics.map(t=>{const a=L.filter(p=>p.topic===t),s=a.filter(p=>p.status==='Solved').length;return`<div style="margin-bottom:8px">${esc(t)} <span class="mute">${s}/${a.length}</span><div class="bar"><i style="width:${a.length?s/a.length*100:0}%"></i></div></div>`}).join('')}<input id="nt" placeholder="Custom topic"> <button class="b" onclick="addTopic()">Add</button></div>
<div class="card" style="grid-column:1/-1"><h3>All problems</h3><select onchange="cf.t=this.value;render()"><option value="">All topics</option>${S.topics.map(t=>`<option ${cf.t===t?'selected':''}>${esc(t)}</option>`).join('')}</select> <select onchange="cf.d=this.value;render()"><option value="">All levels</option>${['Easy','Medium','Hard'].map(t=>`<option ${cf.d===t?'selected':''}>${t}</option>`).join('')}</select>${list.map(p=>`<div class="row"><div class="m"><b>${/^https?:\/\//.test(p.url||'')?`<a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--terra)">${esc(p.name)}</a>`:esc(p.name)}</b><div class="mute"><span class="tag">${esc(p.topic)}</span><span class="tag">${p.diff}</span>${p.status} · ${p.date} · ${p.attempts} attempt${p.attempts>1?'s':''}${p.time?' · '+p.time+'m':''}${p.cx?' · '+esc(p.cx):''}${p.rev?' · revise '+p.rev:''}</div>${p.notes?`<div>${esc(p.notes)}</div>`:''}${p.mistakes?`<div class="mute">Mistakes: ${esc(p.mistakes)}</div>`:''}</div><button class="b" onclick="editP('${p.id}')">✎</button><button class="b" onclick="delP('${p.id}')">🗑</button></div>`).join('')||'<p class="mute">No problems logged yet.</p>'}</div></div>`}
function editP(id){cpId=id||null;$('#c_t').innerHTML=S.topics.map(t=>`<option>${esc(t)}</option>`).join('');const p=S.lc.find(x=>x.id===id)||{};$('#dct').textContent=id?'Edit problem':'Log problem';
$('#c_n').value=p.name||'';$('#c_u').value=p.url||'';$('#c_t').value=p.topic||S.topics[0];$('#c_d').value=p.diff||'Medium';$('#c_dt').value=p.date||today();$('#c_s').value=p.status||'Solved';$('#c_a').value=p.attempts||1;$('#c_m').value=p.time||'';$('#c_no').value=p.notes||'';$('#c_mi').value=p.mistakes||'';$('#c_cx').value=p.cx||'';$('#c_r').value=p.rev||'';dc.showModal()}
function saveP(){const name=$('#c_n').value.trim();if(!name)return toast('Add the problem name');const u=$('#c_u').value.trim();if(u&&!/^https?:\/\//.test(u))return toast('URL must start with http(s)://');
const o={name,url:u,topic:$('#c_t').value,diff:$('#c_d').value,date:$('#c_dt').value||today(),status:$('#c_s').value,attempts:Math.max(1,+$('#c_a').value||1),time:+$('#c_m').value||0,notes:$('#c_no').value,mistakes:$('#c_mi').value,cx:$('#c_cx').value,rev:$('#c_r').value};
if(!o.rev)o.rev=addD(o.date,o.status==='Solved'?{Easy:7,Medium:5,Hard:3}[o.diff]:1);
if(cpId)Object.assign(S.lc.find(x=>x.id===cpId),o);else S.lc.push({id:uid(),revs:0,...o});save();dc.close();render();toast('Logged')}
function delP(id){if(!confirm('Delete this problem record?'))return;S.lc=S.lc.filter(p=>p.id!==id);save();render()}
function revDone(id){const p=S.lc.find(x=>x.id===id);p.revs=(p.revs||0)+1;p.rev=addD(today(),Math.min(60,3*2**p.revs));save();render();toast('Next revision '+p.rev)}
function addTopic(){const v=$('#nt').value.trim();if(v&&!S.topics.includes(v)){S.topics.push(v);save();render()}}
let dtId=null;
function fillSel(){const o=S.cats.map(c=>`<option>${esc(c)}</option>`).join('');$('#f_c').innerHTML=o;$('#g_c').innerHTML=o;$('#f_g').innerHTML='<option value="">None</option>'+S.goals.map(g=>`<option value="${g.id}">${esc(g.title)}</option>`).join('')}
function editT(id,date){fillSel();dtId=id||null;const t=S.tasks.find(x=>x.id===id)||{};$('#dtt').textContent=id?'Edit task':'New task';
$('#f_t').value=t.title||'';$('#f_n').value=t.notes||'';$('#f_c').value=t.cat||S.cats[0];$('#f_g').value=t.goal||'';$('#f_p').value=t.pri||2;$('#f_d').value=t.due||date||'';$('#f_tm').value=t.time||'';$('#f_e').value=t.est||'';$('#f_r').value=t.rec||'';dt.showModal()}
function saveT(){const title=$('#f_t').value.trim();if(!title)return toast('Give the task a title');const o={title,notes:$('#f_n').value,cat:$('#f_c').value,goal:$('#f_g').value,pri:+$('#f_p').value,due:$('#f_d').value,time:$('#f_tm').value,est:+$('#f_e').value||0,rec:$('#f_r').value};
if(o.rec&&!o.due)o.due=today();if(dtId)Object.assign(S.tasks.find(x=>x.id===dtId),o,{notified:false});else S.tasks.push({id:uid(),status:'open',postponed:0,created:today(),...o});save();dt.close();render();toast('Saved')}
function done(id){const t=S.tasks.find(x=>x.id===id);if(t.status==='done'){t.status='open';t.done=null}else{t.status='done';t.done=today();if(t.rec){S.tasks.push({...t,id:uid(),status:'open',done:null,postponed:0,notified:false,due:addD(t.due>today()?t.due:today(),t.rec==='d'?1:7)})}toast('Done. Well done.')}save();render()}
function postpone(id){const t=S.tasks.find(x=>x.id===id);t.due=addD(t.due&&t.due>today()?t.due:today(),1);t.postponed=(t.postponed||0)+1;t.notified=false;save();render();toast('Moved to '+t.due)}
function del(id){if(!confirm('Delete this task permanently? Export a backup first if unsure.'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function split(id){const t=S.tasks.find(x=>x.id===id);['Open it and write the first 3 lines (10 min)','Do the smallest next piece','Finish and review'].forEach((s,i)=>S.tasks.push({id:uid(),status:'open',postponed:0,created:today(),title:t.title+' — '+s,notes:'',cat:t.cat,goal:t.goal,pri:t.pri,due:addD(today(),i),est:i?20:10,rec:''}));t.status='archived';save();render();toast('Split into 3 smaller steps')}
function newG(){fillSel();['g_t','g_a'].forEach(i=>$('#'+i).value='');dg.showModal()}
function saveG(){const t=$('#g_t').value.trim();if(!t)return toast('Name your goal');S.goals.push({id:uid(),title:t,type:$('#g_y').value,cat:$('#g_c').value,next:$('#g_a').value,ms:[]});save();dg.close();view='goals';render()}
function addMs(id){const t=prompt('Milestone');if(t&&t.trim()){S.goals.find(g=>g.id===id).ms.push({t:t.trim(),d:false});save();render()}}
function g_ms(id,i){const m=S.goals.find(g=>g.id===id).ms[i];m.d=!m.d;save();render()}
function delG(id){if(!confirm('Delete goal? Linked tasks stay.'))return;S.goals=S.goals.filter(g=>g.id!==id);S.tasks.forEach(t=>{if(t.goal===id)t.goal=''});save();render()}
function saveR(){S.reviews.push({d:today(),learned:$('#r_learned').value,avoided:$('#r_avoided').value,next:$('#r_next').value});save();render();toast('Review saved')}
function addCat(){const v=$('#nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='maktoob-backup-'+today()+'.json';a.click();toast('Backup downloaded')}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!Array.isArray(d.tasks)||!Array.isArray(d.goals))throw 0;if(!confirm('Replace current data with this backup?'))return;S=Object.assign(def(),d);save();render();toast('Restored')}catch(e){toast('Invalid backup file — nothing changed')}})}
function askN(){if(!('Notification' in window))return toast('Notifications unsupported here');Notification.requestPermission().then(()=>render())}
let T=null,left=0,run=false,ftask=null;
function focusFor(id){ftask=id||null;const e=$('#tm');if(e)e.scrollIntoView({behavior:'smooth'});if(id)tStart()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tStart(){if(run){clearInterval(T);run=false;$('#tgo').textContent='Resume';return}if(!left)left=(+$('#tmin').value||25)*60;run=true;$('#tgo').textContent='Pause';T=setInterval(()=>{left--;const e=$('#tm');if(e)e.textContent=fmt(left);if(left<=0){clearInterval(T);run=false;S.focus.push({d:today(),m:+($('#tmin')?.value||25)});save();left=0;toast('Focus session complete 🌿');if('Notification' in window&&Notification.permission==='granted')new Notification('Maktoob',{body:'Focus session complete.'});render()}},1000)}
function tReset(){clearInterval(T);run=false;left=0;render()}
setInterval(()=>{if(!('Notification' in window)||Notification.permission!=='granted')return;const n=new Date(),d=ymd(n),tm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');let ch=0;open().forEach(t=>{if(t.time&&!t.notified&&(t.due<d||(t.due===d&&t.time<=tm))){new Notification('Maktoob reminder',{body:t.title});t.notified=true;ch=1}});if(ch)save()},30000);
render();
</script></body></html>
